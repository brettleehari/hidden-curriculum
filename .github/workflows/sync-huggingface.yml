name: Sync to HuggingFace
on:
  push:
    branches: [main]
    paths: ['data/**', 'huggingface/**']
  workflow_call:
  workflow_dispatch:

concurrency:
  group: huggingface
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Health gate
        run: node scripts/validate.js
      - name: Generate the dataset card from the master CSV
        run: node scripts/csv-to-json.js
      - name: Push to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet huggingface_hub
          python3 scripts/sync_huggingface.py
